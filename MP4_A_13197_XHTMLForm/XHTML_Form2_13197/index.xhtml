<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>
    <h1>Formulir Pendaftaran Seminar</h1>
    <form action="" method="post" enctype="multipart/form-data">
        
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td colspan="2"><strong>Data Peserta</strong></td>
            </tr>
            <tr>
                <td>
                    <label for="namalengkap"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="namalengkap" name="namalengkap" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="npm"><strong>NPM</strong></label>
                </td>
                <td>
                    <input type="text" id="npm" name="npm" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki" />
                    <label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option value="">Informatika</option>
                        <option value="">Sistem Informasi</option>
                        <option value="">Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td colspan="2"><strong>Pilihan Seminar</strong></td>
            </tr>
            <tr>
                <td>
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="jenistiket" value="Reguler" />
                    <label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="jenistiket" value="VIP" />
                    <label for="vip">VIP</label>
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <input type="checkbox" id="topik1" name="topik[]" value="Web Development" />
                    <label for="topik1">Web Development</label>
                    <br />
                    <input type="checkbox" id="topik2" name="topik[]" value="Data Science" />
                    <label for="topik2">Data Science</label>
                    <br />
                    <input type="checkbox" id="topik3" name="topik[]" value="Artificial Intelligence" />
                    <label for="topik3">Artificial Intelligence</label>
                </td>
            </tr>
        </table>

        <br />

        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td colspan="2"><strong>Informasi Tambahan</strong></td>
            </tr>
            <tr>
                <td style="vertical-align: top;">
                    <label for="alasan"><strong>Alasan Mengikuti Seminar</strong></label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="5" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
        </table>

        <br />

        <div style="text-align: center;">
            <input type="submit" name="simpan" value="Simpan" />
        </div>

    </form>
</body>
</html>
